name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      PUBLIC_SANITY_PROJECT_ID: ki7bs4vk
      PUBLIC_SANITY_DATASET: production
      PUBLIC_SITE_ORIGIN: https://sorouh.site
      PUBLIC_GTM_ID: GTM-MPNKM8RR
      SANITY_STUDIO_PROJECT_ID: ki7bs4vk
      SANITY_STUDIO_DATASET: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.11.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level moderate
      - run: pnpm check
      - run: pnpm --dir web deploy:dry
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

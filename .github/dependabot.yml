version: 2
updates:
  # GitHub uses the npm ecosystem identifier for pnpm lockfiles.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      safe-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Asia/Riyadh
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
